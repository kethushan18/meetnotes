name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: skips onnxruntime-node's native download, which the browser build doesn't use
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
